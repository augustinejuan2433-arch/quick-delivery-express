
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Shipment | Quick Delivery Express</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#090909;
color:#fff;
padding:25px 15px;
}
.container{
max-width:550px;
margin:35px auto;
background:#151515;
padding:28px 22px;
border:1px solid #b99542;
border-radius:12px;
}
h1{text-align:center;color:#d8b45a;font-size:27px}
.subtitle{text-align:center;color:#ccc;line-height:1.5}
input{
width:100%;
padding:15px;
margin:15px 0;
background:#080808;
border:1px solid #b99542;
border-radius:6px;
color:white;
font-size:16px;
}
button{
width:100%;
padding:15px;
background:#c6a34e;
color:#080808;
border:0;
border-radius:6px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
#result{
display:none;
margin-top:25px;
padding:18px;
background:#090909;
border:1px solid #555;
border-radius:8px;
}
.status{
color:#d8b45a;
font-size:20px;
font-weight:bold;
margin-bottom:15px;
}
.detail{
padding:10px 0;
border-bottom:1px solid #333;
line-height:1.5;
overflow-wrap:anywhere;
}
.detail strong{color:#d8b45a}
#message{
color:#ddd;
line-height:1.5;
}
footer{
text-align:center;
color:#999;
font-size:12px;
margin-top:25px;
}
</style>
</head>
<body>

<div class="container">
<h1>QUICK DELIVERY EXPRESS</h1>
<p class="subtitle">Track your shipment anywhere in the world.</p>

<input
id="trackingNumber"
type="text"
placeholder="Enter your tracking number"
autocomplete="off"
>

<button id="trackButton" onclick="trackShipment()">
TRACK SHIPMENT
</button>

<div id="result">
<div class="status" id="shipmentStatus"></div>
<div class="detail"><strong>Tracking Number:</strong> <span id="displayCode"></span></div>
<div class="detail"><strong>Current Location:</strong> <span id="displayLocation"></span></div>
<div class="detail"><strong>Destination:</strong> <span id="displayDestination"></span></div>
<div class="detail"><strong>Estimated Delivery:</strong> <span id="displayDate"></span></div>
<div class="detail"><strong>Shipment Update:</strong><p id="message"></p></div>
</div>

<footer>© Quick Delivery Express. All rights reserved.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://aqfzyfbhyupomcvveqlz.supabase.co";

const SUPABASE_KEY = "sb_publishable_NYH1pUAG9OfE44AxkH2uxQ_QpFszNUG";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function trackShipment(){

const code = document.getElementById("trackingNumber").value.trim().toUpperCase();
const button = document.getElementById("trackButton");
const result = document.getElementById("result");

result.style.display = "block";

if(!code){
document.getElementById("shipmentStatus").textContent = "TRACKING NUMBER REQUIRED";
document.getElementById("message").textContent = "Please enter your tracking number.";
return;
}

button.disabled = true;
button.textContent = "SEARCHING...";

try{

const {data,error} = await db.rpc("track_shipment",{
p_tracking_number: code
});

if(error) throw error;

const shipment = Array.isArray(data) ? data[0] : data;

if(!shipment){
document.getElementById("shipmentStatus").textContent = "TRACKING NUMBER NOT FOUND";
document.getElementById("displayCode").textContent = code;
document.getElementById("displayLocation").textContent = "";
document.getElementById("displayDestination").textContent = "";
document.getElementById("displayDate").textContent = "";
document.getElementById("message").textContent = "Please check your tracking number and try again.";
return;
}

document.getElementById("shipmentStatus").textContent = shipment.status_label || "Shipment registered";
document.getElementById("displayCode").textContent = shipment.tracking_number || code;
document.getElementById("displayLocation").textContent = shipment.latest_location || "Update pending";
document.getElementById("displayDestination").textContent = shipment.destination_country || "Not available";
document.getElementById("displayDate").textContent = shipment.estimated_delivery || "To be confirmed";
document.getElementById("message").textContent = shipment.public_note || "Your shipment is being processed.";

}catch(error){

document.getElementById("shipmentStatus").textContent = "TRACKING ERROR";
document.getElementById("message").textContent = "Unable to retrieve shipment details. Please try again.";

console.error(error);

}finally{

button.disabled = false;
button.textContent = "TRACK SHIPMENT";

}
}
</script>

</body>
</html>
