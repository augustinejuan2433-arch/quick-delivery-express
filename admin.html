
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Delivery Express | Staff Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101010;color:#fff;padding:20px}
.container{max-width:1050px;margin:auto}
header{border-bottom:2px solid #c9a227;padding-bottom:15px;margin-bottom:25px}
h1{color:#d5ad36;margin-bottom:5px}
h2{color:#d5ad36}
.panel{background:#1c1c1c;padding:22px;border:1px solid #444;border-radius:10px;margin-bottom:20px}
input,select,textarea{width:100%;padding:12px;margin:7px 0 15px;background:#292929;color:white;border:1px solid #555;border-radius:5px}
button{background:#c9a227;color:#111;border:0;padding:12px 18px;border-radius:5px;font-weight:bold;cursor:pointer;margin:5px 3px}
button.secondary{background:#444;color:white}
button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{font-size:13px;color:#ddd}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:12px;border-bottom:1px solid #444;text-align:left}
th{color:#d5ad36}
.table-wrap{overflow-x:auto}
#dashboard{display:none}
#message{padding:12px;margin:10px 0;border-radius:5px;display:none;white-space:pre-wrap}
.good{background:#173c25;color:#a7efbd}
.bad{background:#4b2020;color:#ffb0b0}
.small{color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="container">
<header>
<h1>QUICK DELIVERY EXPRESS</h1>
<p>Staff Shipment Management Portal</p>
</header>

<div id="message"></div>

<section id="loginPanel" class="panel">
<h2>Staff Login</h2>
<form id="loginForm">
<label>Email address</label>
<input id="email" type="email" required autocomplete="username">
<label>Password</label>
<input id="password" type="password" required autocomplete="current-password">
<button type="submit" id="loginButton">Log In</button>
</form>
<p class="small">Authorised staff only.</p>
</section>

<section id="dashboard">
<div class="panel">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
<h2>Staff Dashboard</h2>
<button class="secondary" id="logoutButton">Log Out</button>
</div>
<p id="staffEmail" class="small"></p>
</div>

<div class="panel">
<h2 id="formTitle">Register New Shipment</h2>
<form id="shipmentForm">
<input type="hidden" id="shipmentId">

<div class="grid">
<div>
<label>Sender Name</label>
<input id="senderName" required>
</div>
<div>
<label>Sender Email</label>
<input id="senderEmail" type="email">
</div>
<div>
<label>Recipient Name</label>
<input id="recipientName" required>
</div>
<div>
<label>Recipient Email</label>
<input id="recipientEmail" type="email">
</div>
<div>
<label>Recipient Phone Number</label>
<input id="recipientPhone">
</div>
<div>
<label>Origin Country</label>
<input id="origin" required>
</div>
<div>
<label>Destination Country</label>
<input id="destination" required>
</div>
<div>
<label>Latest Location</label>
<input id="location" required>
</div>
<div>
<label>Shipment Status</label>
<select id="status">
<option>Shipment Registered</option>
<option>Picked Up</option>
<option>In Transit</option>
<option>Arrived at Facility</option>
<option>Out for Delivery</option>
<option>Delivered</option>
<option>On Hold</option>
</select>
</div>
<div>
<label>Estimated Delivery</label>
<input id="estimatedDelivery" type="date">
</div>
</div>

<label>Public Tracking Update</label>
<textarea id="publicNote" rows="3" placeholder="Message customers can see when tracking..."></textarea>

<button type="submit" id="saveButton">Register Shipment</button>
<button type="button" class="secondary" id="cancelEdit" style="display:none">Cancel Edit</button>
</form>
</div>

<div class="panel">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">
<h2>Shipment Records</h2>
<button type="button" id="refreshButton">Refresh Records</button>
</div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Tracking Number</th>
<th>Recipient</th>
<th>Destination</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="shipmentRows">
<tr><td colspan="5">Loading shipments...</td></tr>
</tbody>
</table>
</div>
</div>
</section>
</div>

<script>
// Add your Supabase project details here.
const SUPABASE_URL = "https://aqfzyfbhyupomcvveqlz.supabase.co";
const SUPABASE_KEY = "sb_publishable_NYH1pUAG9OfE44AxkH2uxQ_QpFszNUG";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

function showMessage(message, success=false){
  $("message").textContent = message;
  $("message").className = success ? "good" : "bad";
  $("message").style.display = "block";
  window.scrollTo({top:0,behavior:"smooth"});
}

function clearMessage(){
  $("message").style.display = "none";
}

function showDashboard(user){
  $("loginPanel").style.display = "none";
  $("dashboard").style.display = "block";
  $("staffEmail").textContent = "Logged in as: " + user.email;
}

function showLogin(){
  $("loginPanel").style.display = "block";
  $("dashboard").style.display = "none";
}

async function checkSession(){
  const {data,error} = await db.auth.getSession();
  if(error){showMessage(error.message);return;}
  if(data.session){
    const {data:allowed,error:staffError} = await db.rpc("is_staff");
    if(staffError || allowed !== true){
      await db.auth.signOut();
      showLogin();
      showMessage("This account is not authorised as staff.");
      return;
    }
    showDashboard(data.session.user);
    await loadShipments();
  }else{
    showLogin();
  }
}

$("loginForm").addEventListener("submit",async event=>{
  event.preventDefault();
  clearMessage();
  $("loginButton").disabled = true;
  $("loginButton").textContent = "Logging in...";

  const {data,error} = await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });

  $("loginButton").disabled = false;
  $("loginButton").textContent = "Log In";

  if(error){showMessage(error.message);return;}

  const {data:allowed,error:staffError} = await db.rpc("is_staff");
  if(staffError || allowed !== true){
    await db.auth.signOut();
    showMessage("Your account is not authorised for staff access.");
    return;
  }

  showDashboard(data.user);
  showMessage("Staff login successful.",true);
  await loadShipments();
});

$("logoutButton").addEventListener("click",async()=>{
  await db.auth.signOut();
  showLogin();
  showMessage("You have logged out successfully.",true);
});

function makeTrackingNumber(){
  const random = Math.floor(100000 + Math.random()*900000);
  return "QDE-2026-" + random;
}

function getFormData(){
  return {
    sender_name:$("senderName").value.trim(),
    sender_email:$("senderEmail").value.trim() || null,
    recipient_name:$("recipientName").value.trim(),
    recipient_email:$("recipientEmail").value.trim() || null,
    recipient_phone_number:$("recipientPhone").value.trim() || null,
    origin_country:$("origin").value.trim(),
    destination_country:$("destination").value.trim(),
    latest_location:$("location").value.trim(),
    status_label:$("status").value,
    estimated_delivery:$("estimatedDelivery").value || null,
    public_note:$("publicNote").value.trim() || null,
    updated_at:new Date().toISOString()
  };
}

$("shipmentForm").addEventListener("submit",async event=>{
  event.preventDefault();
  clearMessage();

  const id = $("shipmentId").value;
  const payload = getFormData();

  $("saveButton").disabled = true;

  let result;

  if(id){
    result = await db.from("shipments")
      .update(payload)
      .eq("id",id)
      .select();
  }else{
    payload.tracking_number = makeTrackingNumber();
    result = await db.from("shipments")
      .insert(payload)
      .select();
  }

  $("saveButton").disabled = false;

  if(result.error){
    showMessage("Could not save shipment: " + result.error.message);
    return;
  }

  const tracking = result.data && result.data[0]
    ? result.data[0].tracking_number : "";

  resetForm();
  showMessage(id ? "Shipment updated successfully." :
    "Shipment registered successfully. Tracking number: " + tracking,true);
  await loadShipments();
});

async function loadShipments(){
  $("shipmentRows").innerHTML =
    '<tr><td colspan="5">Loading shipments...</td></tr>';

  const {data,error} = await db.from("shipments")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    $("shipmentRows").innerHTML =
      '<tr><td colspan="5">Unable to load shipments.</td></tr>';
    showMessage("Loading error: " + error.message);
    return;
  }

  if(!data.length){
    $("shipmentRows").innerHTML =
      '<tr><td colspan="5">No shipments registered yet.</td></tr>';
    return;
  }

  $("shipmentRows").innerHTML = "";

  data.forEach(shipment=>{
    const tr = document.createElement("tr");

    const values = [
      shipment.tracking_number,
      shipment.recipient_name,
      shipment.destination_country,
      shipment.status_label
    ];

    values.forEach(value=>{
      const td = document.createElement("td");
      td.textContent = value || "-";
      tr.appendChild(td);
    });

    const action = document.createElement("td");
    const edit = document.createElement("button");
    edit.textContent = "Edit";
    edit.addEventListener("click",()=>editShipment(shipment));
    action.appendChild(edit);
    tr.appendChild(action);

    $("shipmentRows").appendChild(tr);
  });
}

function editShipment(s){
  $("shipmentId").value = s.id;
  $("senderName").value = s.sender_name || "";
  $("senderEmail").value = s.sender_email || "";
  $("recipientName").value = s.recipient_name || "";
  $("recipientEmail").value = s.recipient_email || "";
  $("recipientPhone").value = s.recipient_phone_number || "";
  $("origin").value = s.origin_country || "";
  $("destination").value = s.destination_country || "";
  $("location").value = s.latest_location || "";
  $("status").value = s.status_label || "Shipment Registered";
  $("estimatedDelivery").value = s.estimated_delivery || "";
  $("publicNote").value = s.public_note || "";

  $("formTitle").textContent = "Edit Shipment: " + s.tracking_number;
  $("saveButton").textContent = "Save Shipment Update";
  $("cancelEdit").style.display = "inline-block";
  window.scrollTo({top:0,behavior:"smooth"});
}

function resetForm(){
  $("shipmentForm").reset();
  $("shipmentId").value = "";
  $("formTitle").textContent = "Register New Shipment";
  $("saveButton").textContent = "Register Shipment";
  $("cancelEdit").style.display = "none";
}

$("cancelEdit").addEventListener("click",resetForm);
$("refreshButton").addEventListener("click",loadShipments);

db.auth.onAuthStateChange((event,session)=>{
  if(event === "SIGNED_OUT") showLogin();
});

checkSession();
</script>
</body>
</html>
